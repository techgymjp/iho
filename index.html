<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07040f">
<meta name="description" content="表向きは、ただのバー。ドアの音がしたら要注意！45秒のワンタップ偽装経営ゲーム。">
<title>摘発カウントダウン</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>

  <!-- ===== TITLE ===== -->
  <section id="screen-title" class="screen active">
    <div class="title-logo">
      <div class="logo-sub">架空の繁華街「ネオン横丁」</div>
      <h1 class="logo">摘発<br>カウントダウン</h1>
      <div class="logo-catch">表向きは、ただのバー。</div>
    </div>
    <div class="best-box">BEST SCORE <b id="title-best">0</b><small id="title-stats"></small></div>
    <button class="btn btn-primary btn-big" id="btn-start">START</button>
    <div class="title-row">
      <button class="btn btn-ghost" id="btn-howto">遊び方</button>
      <button class="btn btn-ghost" id="btn-sound">🔊 サウンド ON</button>
    </div>
    <p class="disclaimer">※本作はフィクションです。実在の人物・団体・店舗・事件とは関係ありません。現実の無許可営業は法律で禁止されています。</p>
    <div id="legal" class="legal hidden">
      <span id="build-info"></span>
      <a href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener">プライバシーポリシー</a>
      <span id="ad-privacy" class="hidden">｜<a href="#" id="ad-privacy-link">広告の設定</a></span>
    </div>
  </section>

  <!-- ===== GAME ===== -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-row">
        <div class="hud-time"><span id="hud-time">22:00</span><small id="hud-remain">残り 45秒</small></div>
        <div class="hud-cell"><label>売上</label><span id="hud-sales">¥0</span></div>
        <div class="hud-cell"><label>来客数</label><span id="hud-cust">0人</span></div>
        <button id="btn-pause" class="btn-pause" aria-label="一時停止">⏸</button>
      </div>
      <div class="gauge-wrap">
        <label>👁</label>
        <div class="gauge"><div id="heat-fill"></div></div>
        <span id="hud-mode" class="mode">バー営業</span>
      </div>
    </header>

    <div id="toast-area"></div>
    <div id="msg-line" class="msg-line"></div>

    <footer class="controls">
    </footer>
  </section>

  <!-- ===== RESULT ===== -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div id="res-headline" class="res-headline"></div>
      <div id="res-news" class="res-news hidden"></div>
      <div class="res-sales"><span id="res-sales">¥0</span><small>本日の売上 ＝ SCORE</small></div>
      <div class="res-grid">
        <div><small>来客数</small><b id="res-cust"></b></div>
        <div><small>最終ランク</small><b id="res-rank"></b></div>
        <div><small>警察をやり過ごした</small><b id="res-pass"></b></div>
        <div><small>営業時間</small><b id="res-time"></b></div>
      </div>
      <div class="res-best" id="res-best"></div>
      <div class="res-breakdown" id="res-breakdown"></div>
      <div id="res-tip" class="res-tip"></div>
      <div class="res-buttons">
        <button class="btn btn-primary" id="btn-retry">RETRY</button>
        <button class="btn btn-ghost" id="btn-title">TITLE</button>
      </div>
      <button class="btn btn-ghost btn-share" id="btn-share">結果をシェア</button>
    </div>
  </section>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>

  <!-- リワード広告：摘発を「なかったこと」にする（アプリのみ・1 ゲーム 1 回） -->
  <div id="redo" class="redo hidden">
    <div class="redo-box">
      <div class="redo-icon">🙈</div>
      <button class="btn btn-reward" id="redo-watch">▶ 広告を見て もみ消す</button>
      <button class="btn btn-ghost" id="redo-skip">結果へ</button>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/ads-config.js"></script>
<script src="js/build-info.js"></script>
<script src="js/ads.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
